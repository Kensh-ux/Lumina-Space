<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina-Space · 情绪工作台</title>
    <script>
      // 首帧前先套用主题镜像键（由 saveData 同步写入），避免刷新时闪一下默认色。
      try {
        var theme = localStorage.getItem('lumina:theme');
        if (theme !== 'positive' && theme !== 'neutral' && theme !== 'negative') {
          theme = 'neutral';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'neutral';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
